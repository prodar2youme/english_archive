<style>
/* Layout: one 16:9 pixel stage (night museum world) with a VN dialogue box over its lower edge; questions open as a full-screen paper panel. Single dark look by choice. */
:root{
  color-scheme: dark;
  --night:#141a33;
  --night-2:#1e2647;
  --paper:#fff4dc;
  --paper-2:#f3e2bd;
  --ink:#2b1a12;
  --ink-soft:#6b4f3a;
  --tiger:#f28a2e;
  --tiger-deep:#c9631a;
  --stripe:#3a2418;
  --magpie:#3f7fd8;
  --gold:#ffd23f;
  --good:#3fae6a;
  --bad:#e0524d;
  --fg:#f7ecd6;
  --f-pixel:"DotGothic16","NanumSquareRound","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-round:"NanumSquareRound","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--fg);font-family:var(--f-round);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.door:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.game{
  width:min(100%, 1280px, calc((100dvh - 70px) * 16 / 9));
  min-width:0;display:flex;flex-direction:column;gap:8px;container-type:inline-size;
}
/* HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-pixel);font-size:14px}
.hud .room{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.04em;color:#cfc4ff}
.meter{display:flex;gap:6px;align-items:center}
.meter .lbl{font-size:12px;color:#b8b0d8;margin-right:2px}
.slot{width:12px;height:22px;background:#2a3157;box-shadow:0 0 0 2px #0b0f22;position:relative;transform:skewX(-14deg)}
.slot::after{content:"";position:absolute;inset:3px 3px;background:var(--stripe);opacity:0}
.slot.on{background:var(--tiger)}
.slot.on::after{opacity:1}
.slot.half{background:#8a5a37;animation:pulse 1.2s steps(2) infinite}
@keyframes pulse{50%{background:var(--tiger)}}
.timer{font-variant-numeric:tabular-nums;color:#ffe9a8;min-width:74px;text-align:right}
.tbox{position:relative}
.sbox{position:relative}
.score{font-family:var(--f-pixel);color:var(--gold);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}
.score.pop{animation:pop .5s steps(3) 1}
@keyframes pop{50%{transform:scale(1.35)}}
.combo{font-family:var(--f-pixel);font-size:12px;background:var(--bad);color:#fff;padding:2px 7px;box-shadow:0 0 0 2px #0b0f22;white-space:nowrap}
.combo[hidden]{display:none}
.plus{position:absolute;right:0;top:100%;font-family:var(--f-pixel);font-size:16px;color:var(--gold);white-space:nowrap;animation:penf 1.4s steps(6) forwards;pointer-events:none;z-index:40;text-shadow:2px 2px 0 #0b0f22}
.card .ans .big{display:block;font-family:var(--f-pixel);font-size:2em;color:var(--tiger-deep);line-height:1.2}
.card .ans .rank{display:block;font-size:1.15em;margin-bottom:.3em}
.timer.low{color:var(--bad);animation:pulse2 1s steps(2) infinite}
@keyframes pulse2{50%{opacity:.45}}
.timer.hit{animation:hit .6s steps(3) 1;color:var(--bad)}
@keyframes hit{33%{transform:translateX(-4px)}66%{transform:translateX(4px)}}
.pen{position:absolute;right:0;top:100%;font-family:var(--f-pixel);font-size:16px;color:#ff7a74;white-space:nowrap;animation:penf 1.4s steps(6) forwards;pointer-events:none;z-index:40;text-shadow:2px 2px 0 #0b0f22}
@keyframes penf{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(20px)}}
.timeup{position:fixed;inset:0;z-index:30;background:rgba(8,10,24,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.timeup[hidden]{display:none}
.timeup h2{margin:0;font-family:var(--f-round);font-weight:400;font-size:clamp(26px,5vw,56px);color:var(--gold);text-shadow:4px 4px 0 #0b0f22}
.timeup p{margin:0;font-size:clamp(15px,2vw,22px)}
.timeup .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.actor.enter{animation:enter 1.1s steps(6) forwards}
.actor.emerge{animation:emerge 1s steps(6) 1}
.actor.restore{animation:restore 1.4s steps(7) 1}
@keyframes restore{0%{transform:translate(-50%,0) scale(1)}35%{transform:translate(-50%,-10%) scale(1.18);filter:drop-shadow(0 0 10px #ffd23f) brightness(1.35)}70%{transform:translate(-50%,-4%) scale(1.08);filter:drop-shadow(0 0 6px #ffd23f) brightness(1.15)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes emerge{0%{transform:translate(-50%,-150%) scale(.25);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
@keyframes enter{0%{transform:translate(-50%,0) scale(1);opacity:1}100%{transform:translate(-50%,-150%) scale(.25);opacity:0}}
.hbtn{background:#2a3157;border:0;padding:5px 9px;box-shadow:0 0 0 2px #0b0f22;font-size:12px}
.hbtn:hover{background:#38407a}

/* Stage */
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;
  box-shadow:0 0 0 4px #0b0f22,0 0 0 8px #2a3157;user-select:none;cursor:pointer}
.stage canvas.bg,.stage canvas.fx{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.cast{position:absolute;inset:0;pointer-events:none}
.actor{position:absolute;bottom:29%;transform:translateX(-50%);transition:left .5s steps(6),opacity .4s,filter .3s;image-rendering:pixelated}
.actor canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.actor.dim{filter:brightness(.62) saturate(.8)}
.actor.sad canvas{transform:translateY(7%) scaleY(.93);filter:saturate(.45)}
.choices{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:1.8cqi;width:min(62%,560px);cursor:default}
.choices[hidden]{display:none}
.ctitle{text-align:center;font-family:var(--f-round);font-size:clamp(15px,2.2cqi,28px);color:var(--fg);text-shadow:3px 3px 0 #0b0f22}
.choice{font-family:var(--f-round);font-size:clamp(15px,2.3cqi,28px);background:var(--paper);color:var(--ink);border:0;padding:.6em 1em;text-align:left;
  box-shadow:0 0 0 4px var(--ink),0 6px 0 4px var(--ink)}
.choice:hover{background:#ffe2b8}
.choice.no:hover{background:#e3dcef}
.choice:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--ink),0 2px 0 4px var(--ink)}
.choice .k{font-family:var(--f-pixel);color:var(--tiger-deep);margin-right:.6em}
.actor.talk{animation:hop .5s steps(3) 1}

function mix(a,b,t){const A=hex(a),B=hex(b);return "rgb("+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")+")";}
function tigerPal(kind, lv){
  const base = kind==="soo"
    ? {K:"#4a4f63",O:"#f2f3f8",C:"#ffffff",P:"#ffb3c4",E:"#2b6fd6",W:"#ffffff",S:"#3b3f52"}

    : {K:"#3a2418",O:"#f28a2e",C:"#fff1d6",P:"#ff9fb0",E:"#1d1410",W:"#ffffff",S:"#3a2418"};
  const p = Object.assign({}, base);
  for(let g=1; g<=4; g++){ p[String(g)] = mix(base.O, base.S, lv ? lv[g-1] : 1); }

}

let AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,type="square",v=.05,delay=0){
  if(muted) return; const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.value=f;
  const t=a.currentTime+delay; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.02);
}

const actors = {};

  const el=document.createElement("div"); el.className="actor"; el.dataset.id=id;
  const grid = id==="kkachi"?MAGPIE : id==="hodori"?HODORI : TIGER;
  const cv=spriteCanvas(grid); const sh=document.createElement("div"); sh.className="shadow";
  el.appendChild(sh); el.appendChild(cv); castEl.appendChild(el);
  actors[id]={el,cv,grid}; return actors[id];
}
function renderActor(id){
  const a=actors[id]||makeActor(id); const c=a.cv.getContext("2d"); c.clearRect(0,0,a.cv.width,a.cv.height);
  if(id==="kkachi") paint(c,a.grid,MAG_PAL);
  else if(id==="bumi"){ paint(c,a.grid,tigerPal("bumi",S.stripes)); if(S.sad) sadEyes(c,0); else if(S.happy) happyEyes(c,0); }

}
const NARROW = ()=>window.innerWidth<=720;
const LAYOUT = {
  1:{bumi:[50,17]},
  2:{bumi:[33,17],kkachi:[66,11]},
  4:{bumi:[17,15],kkachi:[38,10],hodori:[63,16],soo:[84,16]}
};
function layoutCast(speaker){
  const ids=S.cast; const L=LAYOUT[ids.length]||LAYOUT[2];
  Object.keys(actors).forEach(id=>{ if(!ids.includes(id)) actors[id].el.style.opacity="0"; });
  ids.forEach((id,i)=>{
    const a=actors[id]||makeActor(id); renderActor(id);
    const pos=(L[id]||[30+i*30,14]).slice(); if(NARROW()) pos[1]=Math.round(pos[1]*1.7);
    a.el.style.left=pos[0]+"%"; a.el.style.width=pos[1]+"%";
    a.el.classList.toggle("fly", id==="kkachi");
    a.el.style.bottom = id==="kkachi" ? (window.innerWidth<=720?"60%":"52%") : "";
    let op=1;
    if(id==="bumi"){ const full=S.stripes.filter(v=>v>=1).length; op=Math.min(1,.42+full*.15); if(S.fade) op*=.6; }
    a.el.style.opacity=String(op);

  });
}

function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }

  if(S.timerOn && r<=0) timeUp(); }

let typing=null, fullText="", busy=false;

function baseStripes(){ return [1,2,3,4].map(i=>S.done.has(i)?(i===4?.5:1):0); }
function applyState(node){
  if(node.bg) S.bg=node.bg;
  if("frame" in node) S.frame=node.frame;
  if(node.cast) S.cast=node.cast.slice();
  if(node.castLater) S.cast=node.castLater.slice();
  if("fade" in node) S.fade=node.fade;
  if("flicker" in node) S.flicker=node.flicker;
  if("screen" in node) S.screen=node.screen;
  if("sad" in node) S.sad=node.sad;
  if("happy" in node) S.happy=node.happy;
  if(node.faint && S.stripes[node.faint-1]<1) S.stripes[node.faint-1]=.5;
  if(node.stripe) S.stripes[node.stripe-1]=1;
}
function simulate(seg, upto){
  S.stripes=baseStripes(); S.fade=false; S.flicker=false; S.screen=false; S.sad=false; S.happy=false; S.frame=false; S.cast=[]; S.bg="museum";
  if(seg==="epi"){ S.stripes=[1,1,1,0]; }
  const nodes=SEG[seg].nodes; for(let i=0;i<=upto && i<nodes.length;i++) applyState(nodes[i]);
}

function startSeg(seg){
  S.seg=seg; S.idx=0; S.mode="story";
  hub.hidden=true; titleCard.hidden=true;
  simulate(seg,-1);
  if(seg==="epi") S.stripes=[1,1,1,S.stripes[3]];
  show(0,true);
}

function show(i, animate){
  const nodes=SEG[S.seg].nodes; S.idx=i; const node=nodes[i];
  if(!node){ return; }
  const prevBg=S.bg, prevStripes=S.stripes.slice();
  applyState(node);
  clearTimeout(S._rt);
  if(node.returnToFrame && !animate){ S.bg="museum"; S.frame=true; S.cast=[]; }
  drawBG(); hud();
  card.hidden=true; dlg.hidden=true; $("choices").hidden=true;
  const speaker = node.s || null;
  layoutCast(speaker);

  if(animate){
    if(node.fx==="blackout"){ const b=$("blackout"); b.classList.remove("go"); void b.offsetWidth; b.classList.add("go"); }
    if(node.castLater){ setTimeout(()=>{ layoutCast(null); sparkleAt("kkachi",6); },900); S.cast=[]; layoutCast(null); S.cast=node.castLater.slice(); }
    if(node.fx==="sparkle") setTimeout(()=>sparkleAt("bumi",8),150);
    if(node.fx==="framecall") setTimeout(()=>frameSparkle(.53,.2,8),150);
    if(node.fx==="emerge"){ const k=actors.kkachi; if(k){ k.el.classList.remove("emerge"); void k.el.offsetWidth; k.el.classList.add("emerge"); setTimeout(()=>k.el.classList.remove("emerge"),1100); } SFX.door(); setTimeout(()=>sparkleAt("kkachi",8),900); }
    if(node.fx==="jump"){ const a=actors.bumi; if(a){ a.el.classList.remove("jump"); void a.el.offsetWidth; a.el.classList.add("jump"); } }
    if(node.fx==="roar"){ setTimeout(()=>{ shake(); SFX.roar(); flash(); sparkleAt("bumi",14); },250); }
    if(node.returnToFrame){
      S._rt=setTimeout(()=>{
        ["bumi","kkachi"].forEach(id=>{ const a=actors[id]; if(a){ a.el.classList.remove("dim","talk"); a.el.classList.add("enter"); } });
        S._rt=setTimeout(()=>{
          ["bumi","kkachi"].forEach(id=>actors[id]&&actors[id].el.classList.remove("enter"));
          S.bg="museum"; S.frame=true; S.cast=[]; drawBG(); layoutCast(null); flash(); SFX.stripe(); frameSparkle();
        },1100);
      },2600);
    }
    if(node.stripe && prevStripes[node.stripe-1]<1){ setTimeout(()=>{ flash(); SFX.stripe(); sparkleAt("bumi",16); const a=actors.bumi; if(a){ a.el.classList.remove("restore"); void a.el.offsetWidth; a.el.classList.add("restore"); setTimeout(()=>a.el.classList.remove("restore"),1500); } },200); }
    if(node.faint && prevStripes[node.faint-1]===0){ setTimeout(()=>sparkleAt("bumi",5),200); }
    if(speaker) talk(speaker);
  }

  if(node.title || node.banner){
    $("cardEyebrow").textContent=node.eyebrow||"";
    $("cardTitle").textContent=node.title||node.banner;
    card.classList.toggle("banner", !!node.banner);
    $("cardAns").hidden=true; $("cardBtn").hidden=true; $("cardHint").hidden=false;
    card.hidden=false; S.mode="card"; return;
  }
  if(node.choice){ S.mode="choice"; openChoice(node.choice); return; }
  if(node.q){ S.mode="q"; openQ(node.q); return; }
  if(node.clear){ showClear(node); return; }
  if(node.end){
    if(S.bg==="museum" && S.frame){ showEnd(); return; }
    S.mode="busy"; dlg.hidden=true;
    ["bumi","kkachi"].forEach(id=>{ const a=actors[id]; if(a){ a.el.classList.remove("enter","dim","talk"); void a.el.offsetWidth; a.el.classList.add("enter"); } });
    setTimeout(()=>{
      ["bumi","kkachi"].forEach(id=>actors[id]&&actors[id].el.classList.remove("enter"));
      S.bg="museum"; S.frame=true; S.cast=[]; drawBG(); layoutCast(null); flash(); SFX.stripe(); frameSparkle();
      setTimeout(showEnd,1800);
    },1100);
    return;
  }

  S.mode="story";
  dlg.hidden=false;
  dlg.classList.toggle("narr", !speaker);
  if(speaker){ nameEl.hidden=false; nameEl.textContent=WHO[speaker].name; nameEl.style.background=WHO[speaker].color; }
  else nameEl.hidden=true;
  const pt=$("portrait");
  if(speaker && !WHO[speaker].noPortrait){ pt.hidden=false; pt.style.setProperty("--pbg",WHO[speaker].pbg); drawPortrait(speaker); } else pt.hidden=true;
  type(node.n || node.t);
  $("backBtn").hidden = prevTextIndex(i)<0;
}

function sadEyes(c,oy){
  c.fillStyle="#f28a2e"; c.fillRect(6,7+oy,2,2); c.fillRect(16,7+oy,2,2);
  c.fillStyle="#3a2418"; c.fillRect(6,8+oy,2,1); c.fillRect(16,8+oy,2,1);
  c.fillStyle="#6fb6ff"; c.fillRect(6,9+oy,1,2); c.fillRect(17,9+oy,1,2);
}
function happyEyes(c,oy){
  c.fillStyle="#f28a2e"; c.fillRect(5,7+oy,4,2); c.fillRect(15,7+oy,4,2);
  c.fillStyle="#1d1410"; [[5,8],[6,7],[7,7],[8,8],[15,8],[16,7],[17,7],[18,8]].forEach(([x,y])=>c.fillRect(x,y+oy,1,1));
}
function drawPortrait(id){
  const cv=$("pcv"), c=cv.getContext("2d"); c.clearRect(0,0,24,24);
  if(id==="kkachi"){ paint(c, MAGPIE, MAG_PAL, 4, 6); return; }

function openChoice(n){
  const box=$("choices"); box.innerHTML='<div class="ctitle">범이의 거래, 어떻게 할까?</div>';
  const mk=(label,key,cls,fn)=>{ const b=document.createElement("button"); b.type="button"; b.className="choice "+cls; b.dataset.key=key;
    b.innerHTML='<span class="k">'+key+'</span>'+label; b.addEventListener("click",ev=>{ ev.stopPropagation(); fn(); }); box.appendChild(b); };
  mk("거래를 받아들인다","1","yes",()=>{ box.hidden=true; S.mode="busy"; S.sad=false; S.fade=false; layoutCast(null); SFX.ok(); sparkleAt("bumi",12); setTimeout(openHub,900); });

function type(text){
  clearInterval(typing); fullText=text; let k=0; txtEl.textContent=""; moreEl.hidden=true; $("portrait").classList.add("talking");
  if(reduce){ txtEl.textContent=text; moreEl.hidden=false; typing=null; $("portrait").classList.remove("talking"); return; }
  typing=setInterval(()=>{ k++; txtEl.textContent=text.slice(0,k); if(k%3===0) SFX.tick();
    if(k>=text.length){ clearInterval(typing); typing=null; moreEl.hidden=false; $("portrait").classList.remove("talking"); } },26);
}

function advance(){
  if(S.mode==="title"||S.mode==="hub"||S.mode==="q"||S.mode==="clear"||S.mode==="end"||S.mode==="choice"||S.mode==="busy") return;
  if(typing){ clearInterval(typing); typing=null; txtEl.textContent=fullText; moreEl.hidden=false; $("portrait").classList.remove("talking"); return; }
  const nodes=SEG[S.seg].nodes;
  if(S.idx<nodes.length-1) show(S.idx+1,true);
  else if(S.seg==="prologue") openHub();
}
function prevTextIndex(i){
  const nodes=SEG[S.seg].nodes; for(let j=i-1;j>=0;j--){ if(nodes[j].n||nodes[j].s) return j; } return -1;
}
function goBack(){
  const j=prevTextIndex(S.idx); if(j<0) return;
  clearInterval(typing); typing=null;
  simulate(S.seg, j-1); show(j,false);
}

stage.addEventListener("click",e=>{
  if(e.target.closest("button")||e.target.closest(".door")) return;
  if(S.mode==="card"){ card.hidden=true; S.mode="story"; const nodes=SEG[S.seg].nodes; if(S.idx<nodes.length-1) show(S.idx+1,true); return; }
  advance();
});
$("backBtn").addEventListener("click",e=>{ e.stopPropagation(); goBack(); });
document.addEventListener("keydown",e=>{
  if(S.mode==="choice"){ const b=document.querySelector('#choices [data-key="'+e.key+'"]'); if(b){ e.preventDefault(); b.click(); } return; }
  if(S.mode==="busy") return;
  if(S.mode==="q"){ const n=parseInt(e.key,10); if(n>=1&&n<=5){ const b=document.querySelectorAll("#qbody .opt")[n-1]; if(b&&!b.disabled) b.click(); } return; }
  if(e.key===" "||e.key==="Enter"||e.key==="ArrowRight"){
    if(document.activeElement && document.activeElement.tagName==="BUTTON" && S.mode!=="story" && S.mode!=="card") return;
    e.preventDefault();
    if(S.mode==="card"){ card.hidden=true; S.mode="story"; show(S.idx+1,true); } else advance();
  }
  if(e.key==="ArrowLeft" && S.mode==="story") goBack();
});

  {n:1,seg:"r1",lab:"고대의 방",c:"#8c7a6b"},
  {n:2,seg:"r2",lab:"설화의 방",c:"#c99a45"},

  DOORS.forEach(d=>{
    const st = S.done.has(d.n)?"done" : (next && next.n===d.n)?"open":"locked";

    b.innerHTML='<div class="frame"><span class="num">'+ROMAN[d.n-1]+'</span><span class="knob"></span><span class="state">'+(st==="done"?"✦":st==="locked"?"🔒":"")+'</span></div><span class="lab">'+d.lab+'</span>';
    if(st==="locked") b.disabled=false;
    b.addEventListener("click",ev=>{ ev.stopPropagation(); if(st!=="open"){ if(st==="locked"){ b.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:240}); SFX.no(); } return; } SFX.door(); startSeg(d.seg); });

  const cap=document.createElement("div"); cap.className="hubcap";
  if(next){ cap.textContent="빛나는 문을 눌러 들어가세요"; }
  else { cap.innerHTML='줄무늬를 모두 모았어요!<br>'; const btn=document.createElement("button"); btn.type="button"; btn.className="pbtn"; btn.textContent="범이에게 돌아가기";
    btn.addEventListener("click",ev=>{ev.stopPropagation(); startSeg("epi");}); cap.appendChild(btn); }
  hub.appendChild(cap); hub.hidden=false;
}

function showClear(node){
  S.mode="clear"; S.done.add(node.clear); if(node.clear===4){ S.finalRemain=Math.max(0,remaining()); S.timerOn=false; } hud();
  $("cardEyebrow").textContent="ROOM "+node.clear+" CLEAR";
  $("cardTitle").textContent=["고대","설화","사라짐","현대"][node.clear-1]+"의 방 탈출 성공!";
  card.classList.add("banner");
  $("cardAns").hidden=true;
  const btn=$("cardBtn"); btn.hidden=false; btn.textContent= node.clear===4 ? "기억의 문으로" : "다음 문으로";
  btn.onclick=ev=>{ ev.stopPropagation(); openHub(); };
  $("cardHint").hidden=true; card.hidden=false; SFX.ok();
}
function showEnd(){
  S.mode="end"; S.timerOn=false; const left=(S.finalRemain!=null?S.finalRemain:Math.max(0,remaining()));
  $("cardEyebrow").textContent="THE FADING TIGER";
  $("cardTitle").textContent="THE END";
  card.classList.remove("banner");
  const ans=$("cardAns"); ans.innerHTML="<span class=\"rank\">"+rankOf(S.score)+"</span><span class=\"big\">"+S.score.toLocaleString("ko-KR")+"점</span>"+"한 번에 맞힌 문제 "+S.firstTry+"/"+S.answered.size+" · 최고 연속 "+S.maxCombo+" · 오답 "+S.wrongs+"회<br>남은 시간 "+fmt(left)+" · 줄무늬 4/4"; ans.hidden=false;
  const btn=$("cardBtn"); btn.hidden=false; btn.textContent="처음으로";
  btn.onclick=ev=>{ ev.stopPropagation(); goTitle(); };
  $("cardHint").hidden=true; card.hidden=false;
}

/* ================= QUESTIONS ================= */
function openQ(id){
  const q=Q[id]; S.tries[id]=S.tries[id]||0;
  $("qn").textContent="Q"+id; $("qr").textContent=q.room; $("qtries").textContent="";
  $("qprompt").innerHTML=q.prompt;
  const ps=$("qpassage"); if(q.passage){ ps.innerHTML=q.passage; ps.hidden=false; } else ps.hidden=true;
  const body=$("qbody"), act=$("qact"), fb=$("qfb"); body.innerHTML=""; act.innerHTML=""; fb.textContent=""; fb.className="fb";
  if(q.type==="order") buildOrder(q,id); else if(q.type==="blanks") buildBlanks(q,id); else if(q.type==="drag") buildDrag(q,id); else buildMC(q,id);
  qwrap.hidden=false;
  setTimeout(()=>{ $("qpanel").focus({preventScroll:true}); },30);
}
function wrong(id,msg){
  S.tries[id]++; S.combo=0; updateScore(0); const sec=penalize(); const fb=$("qfb"); fb.className="fb bad"; fb.textContent="🐦 "+(msg||WRONG_LINES[(S.tries[id]-1)%WRONG_LINES.length])+"  (⏱ -"+sec+"초)";
  $("qtries").textContent="시도 "+S.tries[id]+"회";
  const p=$("qpanel"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake"); SFX.no();
}
function right(id){
  let line="정답! ✨";
  if(!S.answered.has(id)){
    S.answered.add(id); let gain;
    if(S.tries[id]===0){
      S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo); S.firstTry++;
      const bonus=Math.min(20*(S.combo-1),200); gain=100+bonus;
      line+="  +100점"+(bonus?" · "+S.combo+"연속 보너스 +"+bonus+"점":"");
    } else { gain=50; line+="  +50점 (다시 도전해서 맞힘)"; }
    S.score+=gain; updateScore(gain);
  }
  const fb=$("qfb"); fb.className="fb good"; fb.textContent=line; SFX.ok();
  setTimeout(()=>{ qwrap.hidden=true; S.mode="story"; show(S.idx+1,true); },1300);
}
function buildMC(q,id){
  const wrap=document.createElement("div"); wrap.className="opts";
  q.opts.forEach((o,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="opt"; b.innerHTML=o;
    b.addEventListener("click",()=>{ if(i===q.ans){ b.classList.add("right"); wrap.querySelectorAll(".opt").forEach(x=>x.disabled=true); right(id); }
      else { b.classList.add("wrong"); b.disabled=true; wrong(id); } });
    wrap.appendChild(b); });
  $("qbody").appendChild(wrap);
}
function buildOrder(q,id){
  const line=document.createElement("div"); line.className="line"; line.setAttribute("aria-label","내가 만든 문장");
  const pool=document.createElement("div"); pool.className="pool";
  let picked=[];
  const tiles=q.tiles.map((t,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="tile"; b.textContent=t;
    b.addEventListener("click",()=>{ picked.push(i); b.classList.add("used"); render(); }); pool.appendChild(b); return b; });
  function render(){ line.innerHTML=""; picked.forEach((ti,pos)=>{ const b=document.createElement("button"); b.type="button"; b.className="tile"; b.textContent=q.tiles[ti];
      b.title="눌러서 빼기"; b.addEventListener("click",()=>{ picked.splice(pos,1); tiles[ti].classList.remove("used"); render(); }); line.appendChild(b); }); }
  $("qbody").append(line,pool);
  const reset=document.createElement("button"); reset.type="button"; reset.className="sbtn"; reset.textContent="다시 놓기";
  reset.addEventListener("click",()=>{ picked=[]; tiles.forEach(t=>t.classList.remove("used")); render(); });
  const ok=document.createElement("button"); ok.type="button"; ok.className="pbtn"; ok.textContent="확인";
  ok.addEventListener("click",()=>{
    if(picked.length<q.tiles.length){ $("qfb").className="fb bad"; $("qfb").textContent="🐦 아직 쓰지 않은 단어가 있어!"; return; }
    if(picked.every((v,k)=>v===q.order[k])){ line.querySelectorAll(".tile").forEach(t=>{t.disabled=true;t.style.background="#c6efd3";}); ok.disabled=true; reset.disabled=true; right(id); }
    else wrong(id);
  });
  $("qact").append(reset,ok);
}
function buildDrag(q,id){
  const ps=$("qpassage"); ps.hidden=false; ps.innerHTML="";
  const slots={}, filled={}, tiles={}; let selected=null;
  q.parts.forEach(pt=>{ if(pt==="A"||pt==="B"){ const d=document.createElement("span"); d.className="drop"; d.dataset.slot=pt; slots[pt]=d; render0(d,pt); ps.appendChild(d); } else ps.appendChild(document.createTextNode(pt)); });
  function render0(d,k){ d.innerHTML='<span class="lab">('+k+')</span>'; d.classList.remove("filled"); }
  function render(k){ const d=slots[k]; if(filled[k]){ d.textContent=filled[k]; d.classList.add("filled"); } else render0(d,k); }
  function clearSel(){ selected=null; Object.values(tiles).forEach(t=>t.classList.remove("sel")); }
  function place(k,w){
    Object.keys(filled).forEach(o=>{ if(filled[o]===w){ delete filled[o]; render(o); } });
    if(filled[k]) tiles[filled[k]].classList.remove("used");
    filled[k]=w; tiles[w].classList.add("used"); slots[k].classList.remove("bad"); render(k); clearSel(); SFX.tick();
  }
  Object.entries(slots).forEach(([k,d])=>d.addEventListener("click",()=>{
    if(selected) place(k,selected);
    else if(filled[k]){ tiles[filled[k]].classList.remove("used"); delete filled[k]; render(k); }
  }));
  function attachDrag(t,w){
    t.addEventListener("pointerdown",e=>{
      if(t.classList.contains("used")||t.disabled) return; e.preventDefault();
      const sx=e.clientX, sy=e.clientY; let ghost=null, over=null;
      const move=ev=>{
        if(!ghost && Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ ghost=t.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("sel"); document.body.appendChild(ghost); }
        if(ghost){ ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
          const el=document.elementFromPoint(ev.clientX,ev.clientY); const d=el&&el.closest(".drop");
          if(over&&over!==d) over.classList.remove("over"); over=d; if(d) d.classList.add("over"); }
      };
      const up=()=>{
        document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",up);
        if(ghost){ ghost.remove(); if(over){ over.classList.remove("over"); place(over.dataset.slot,w); } }
        else { const was=selected===w; clearSel(); if(!was){ selected=w; t.classList.add("sel"); } }
      };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up); document.addEventListener("pointercancel",up);
    });
  }
  const hint=document.createElement("div"); hint.className="dhint"; hint.textContent="단어를 끌어서 빈칸에 넣으세요. (단어를 누른 뒤 빈칸을 눌러도 돼요)";
  const bank=document.createElement("div"); bank.className="wbank";
  q.groups.forEach(g=>{ const row=document.createElement("div"); row.className="wrow";
    const l=document.createElement("span"); l.className="glab"; l.textContent=g.label; row.appendChild(l);
    g.words.forEach(w=>{ const t=document.createElement("button"); t.type="button"; t.className="tile"; t.textContent=w; tiles[w]=t; attachDrag(t,w); row.appendChild(t); });
    bank.appendChild(row); });
  $("qbody").append(hint,bank);
  const ok=document.createElement("button"); ok.type="button"; ok.className="pbtn"; ok.textContent="확인";
  ok.addEventListener("click",()=>{
    if(!filled.A||!filled.B){ $("qfb").className="fb bad"; $("qfb").textContent="🐦 빈칸 (A), (B)를 모두 채워 줘!"; return; }
    const a=filled.A===q.answer.A, b=filled.B===q.answer.B;
    slots.A.classList.toggle("bad",!a); slots.B.classList.toggle("bad",!b);
    if(a&&b){ ok.disabled=true; Object.values(tiles).forEach(t=>t.disabled=true); right(id); }
    else wrong(id,(a||b)?"하나는 맞았어! 빨간 빈칸을 다시 채워 봐.":null);
  });
  $("qact").appendChild(ok);
}
function buildBlanks(q,id){
  const bank=document.createElement("div"); bank.className="bank"; bank.textContent=q.bank.join(" / ");
  const wrap=document.createElement("div"); wrap.className="blk";
  const sel=q.rows.map(()=>null), slots=[];
  q.rows.forEach((r,ri)=>{
    const row=document.createElement("div"); row.className="brow";
    const p=document.createElement("div"); p.append(document.createTextNode(r.label+" "+r.before));
    const sl=document.createElement("span"); sl.className="slotx"; sl.textContent=" "; slots.push(sl); p.append(sl, document.createTextNode(r.after));
    const chips=document.createElement("div"); chips.className="chips";
    q.bank.forEach(opt=>{ const c=document.createElement("button"); c.type="button"; c.className="chip"; c.textContent=opt;
      c.addEventListener("click",()=>{ sel[ri]=opt; sl.textContent=opt; sl.classList.remove("bad"); chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x===c)); });
      chips.appendChild(c); });
    row.append(p,chips); wrap.appendChild(row);
  });
  $("qbody").append(wrap);
  const ok=document.createElement("button"); ok.type="button"; ok.className="pbtn"; ok.textContent="확인";
  ok.addEventListener("click",()=>{
    if(sel.some(v=>!v)){ $("qfb").className="fb bad"; $("qfb").textContent="🐦 빈칸 세 개를 모두 채워 줘!"; return; }
    let good=0; q.rows.forEach((r,ri)=>{ const okk=sel[ri]===r.ans; if(okk) good++; slots[ri].classList.toggle("bad",!okk); });
    if(good===q.rows.length){ ok.disabled=true; wrap.querySelectorAll(".chip").forEach(c=>c.disabled=true); right(id); }
    else wrong(id, good+"개는 맞았어! 빨간 빈칸을 다시 골라 봐.");
  });
  $("qact").append(ok);
}

/* ================= TITLE ================= */
function goTitle(){
  clearTimeout(S._rt); S.mode="title"; S.seg=null; S.done=new Set(); S.stripes=[0,0,0,0]; S.timerOn=false; S.penalty=0; S.wrongs=0; S.finalRemain=null; resetScore(); $("timer").textContent="☀ 20:00"; $("timer").classList.remove("low");
  S.bg="museum"; S.frame=true; S.cast=[]; card.hidden=true; dlg.hidden=true; hub.hidden=true; qwrap.hidden=true; $("choices").hidden=true;
  drawBG(); layoutCast(null); hud(); titleCard.hidden=false;
}
function begin(seg){
  ac(); S.t0=Date.now(); S.penalty=0; S.wrongs=0; S.finalRemain=null; resetScore(); S.timerOn=true; S.done=new Set(); tickTimer();
  const n={prologue:0,r1:0,r2:1,r3:2,r4:3,epi:4}[seg]; for(let i=1;i<=n;i++) S.done.add(i);
  if(seg==="prologue"||seg==="epi") startSeg(seg); else { openHub(); }
}
$("startBtn").addEventListener("click",e=>{ e.stopPropagation(); begin("prologue"); });
window.addEventListener("resize",()=>{ if(S.mode!=="title") layoutCast(null); });

goTitle();
})();
</script>
